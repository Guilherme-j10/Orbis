[package]
name = "orbis"
version = "0.1.0"
edition = "2024"

[dependencies]
femtovg = { version = "0.25.1", features = ["wgpu"] }
winit = "0.30.13"
wgpu = { version = "29.0.3", default-features = false, features = ["vulkan"] }
pollster = "0.4.0"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
bincode = "1.3.3"
rustc-hash = "2.1.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3